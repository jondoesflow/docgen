# Example docgen configuration. All keys optional; shown with their defaults.
# docgen looks for ./docgen.yaml in the working directory, or use --config.
# NOTE: the Anthropic API key is NEVER configured here — set ANTHROPIC_API_KEY.

output_dir: out

# Documents rendered when --docs is not given.
default_docs:
  - lld
  - data-dictionary
  - security
  - deployment
  - licensing
  - hygiene
  - hld
  - integration
  - rraid

formats: [md, docx]

# Path to a branded docxtpl template; omit to use the built-in default.
# docx_template: templates/client-brand.docx

# Folder containing licensing.yaml / deprecations.yaml / naming.yaml overrides.
# A file present there fully replaces the built-in one of the same name.
# rules_dir: rules/

# Anonymisation rules applied before anything is sent to the Anthropic API.
# redact_file: redact.yaml

llm:
  model: claude-sonnet-4-6
  max_tokens: 4096
  enabled: true
