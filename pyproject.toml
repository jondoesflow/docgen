[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgen"
version = "0.1.0"
description = "Living design documentation generator for Dynamics 365 CE / Power Platform solutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "python-docx>=1.1",
    "docxtpl>=0.16",
    "rapidfuzz>=3.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "keyring>=25.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
docgen = "docgen.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
